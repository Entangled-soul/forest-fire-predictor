<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Fire Prediction model</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #777777;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
            font-size: 28px;
        }
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        input, select {
            padding: 12px;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
            background-color: #fff;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 20px;
        }
        button:hover {
            background-color: #ff5252;
        }
        button:active {
            transform: translateY(2px);
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #e8f5e9;
            border-left: 5px solid #4caf50;
            border-radius: 6px;
            text-align: center;
        }
        .result-box h3 {
            margin: 0;
            color: #2e7d32;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Forest Fire Predictor</h2>
    <p class="subtitle">Enter meteorological parameters to predict the Fire Weather Index (FWI)</p>

    <form action="/predictdata" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="Temperature">Temperature (°C)</label>
                <input type="number" step="any" name="Temperature" id="Temperature" placeholder="e.g., 32.5" required>
            </div>
            
            <div class="form-group">
                <label for="RH">Relative Humidity (%)</label>
                <input type="number" step="any" name="RH" id="RH" placeholder="e.g., 45" required>
            </div>

            <div class="form-group">
                <label for="Ws">Wind Speed (km/h)</label>
                <input type="number" step="any" name="Ws" id="Ws" placeholder="e.g., 15" required>
            </div>

            <div class="form-group">
                <label for="Rain">Rain (mm)</label>
                <input type="number" step="any" name="Rain" id="Rain" placeholder="e.g., 0.0" required>
            </div>

            <div class="form-group">
                <label for="FFMC">FFMC Index</label>
                <input type="number" step="any" name="FFMC" id="FFMC" placeholder="e.g., 88.2" required>
            </div>

            <div class="form-group">
                <label for="DMC">DMC Index</label>
                <input type="number" step="any" name="DMC" id="DMC" placeholder="e.g., 25.4" required>
            </div>

            <div class="form-group">
                <label for="ISI">ISI Index</label>
                <input type="number" step="any" name="ISI" id="ISI" placeholder="e.g., 8.5" required>
            </div>

            <div class="form-group">
                <label for="Classes">Fire Occurrence</label>
                <select name="Classes" id="Classes" required>
                    <option value="0">No Fire</option>
                    <option value="1">Fire Detected</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="Region">Region</label>
                <select name="Region" id="Region" required>
                    <option value="0">Algerian Region</option>
                    <option value="1">Sidi Bel-abbes Region</option> 
                </select>
            </div>

            <button type="submit" class="full-width">Predict FWI</button>
        </div>
    </form>

    {% if results is defined %}
    <div class="result-box">
        <h3>Predicted Result: {{ results | round(2) }}</h3>
    </div>
    {% endif %}
</div>

</body>
</html>
